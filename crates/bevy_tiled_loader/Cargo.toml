[package]
name = "bevy_tiled_loader"
version = "0.2.2"
description = "Asset loader for the Tiled data parsed."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["tiled", "tmx", "parse", "bevy"]
categories = ["development-tools", "game-development"]

[features]
default = []
rapier2d_colliders = ["dep:bevy_rapier2d"]
avian2d_colliders = ["dep:avian2d"]

[dependencies]
try_match.workspace = true
tiled_parse.workspace = true
anyhow = "1.0"
bevy_platform = "0.16"
bevy = {version = "0.16", default-features = false, features = [
  "std",
  "bevy_asset",
  "bevy_scene",
  "bevy_sprite",
  "serialize",
  "png",
]}
serde = "1.0.210"
bincode = "1.3.3"
bevy_rapier2d = { version = "0.28.0", default-features = false, features = [
  "serde-serialize",
  "dim2"
], optional = true }
avian2d = { version = "0.3.0", default-features = false, features = [
  "2d",
  "f32",
  "parry-f32",
  "serialize"
], optional = true }


[dev-dependencies]
bevy = {version = "0.16", default-features = false, features = [
  "std",
  "bevy_asset",
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_scene",
  "bevy_sprite",
  "bevy_winit",
  "x11",
  "serialize",
  "png",
]}
avian2d = { version = "0.3.0", default-features = false, features = [
  "2d",
  "f32",
  "parry-f32",
  "debug-plugin",
  "serialize"
]}

[[example]]
name = "load_tiled_components"
required-features = ["avian2d_colliders"]
