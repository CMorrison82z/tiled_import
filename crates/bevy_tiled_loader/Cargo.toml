[package]
name = "bevy_tiled_loader"
version = "0.1.0"
description = "Asset loader for the Tiled data parsed."
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["tiled", "tmx", "parse", "bevy"]
categories = ["development tools", "game development"]

[dependencies]
try_match.workspace = true
tiled_parse.workspace = true
bevy = {version = "0.15.1", features = [
  "bevy_asset",
  "bevy_sprite",
  "png",
]}
serde = "*"
bincode = "*"
bevy_rapier2d = { version = "0.28.0", features = ["serde-serialize"], optional = true }
avian2d = { version = "0.2.0", features = ["serialize"], optional = true }

[features]
default = []
rapier2d_colliders = ["dep:bevy_rapier2d"]
avian2d_colliders = ["dep:avian2d"]
